[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-chats"
version = "0.1.0"
description = "Interactive Terminal User Interface (TUI) and fuzzy search browser to browse, inspect, and resume previous Claude Code (claude) conversations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Vaibhav Singh Shekhawat", email = "razorninjas@users.noreply.github.com" }
]
keywords = ["claude", "claude-code", "tui", "fzf", "ai-agent", "agent-trajectory", "history-browser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=12.0.0",
    "pyperclip>=1.8.0",
]

[project.scripts]
claude-chats = "claude_chats:main"
claude-history = "claude_chats:main"
csess = "claude_chats:main"

[project.urls]
Homepage = "https://github.com/52191314/claude-chats"
Repository = "https://github.com/52191314/claude-chats"
